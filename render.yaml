services:

  # ==========================================================
  # MOODIFY API
  # FastAPI + TensorFlow/Keras + OpenCV
  # ==========================================================

  - type: web
    runtime: docker
    name: moodify-api
    plan: free
    region: singapore

    rootDir: backend
    dockerfilePath: ./Dockerfile

    healthCheckPath: /health/live
    autoDeployTrigger: commit

    envVars:
      - key: MOODIFY_SECRET_KEY
        generateValue: true

      - key: MOODIFY_EMOTION_LABELS
        value: angry,disgust,fear,happy,sad,surprise,neutral

      - key: MOODIFY_FRONTEND_ORIGINS
        sync: false

      - key: TF_NUM_INTRAOP_THREADS
        value: "1"

      - key: TF_NUM_INTEROP_THREADS
        value: "1"

      - key: OMP_NUM_THREADS
        value: "1"

      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"


  # ==========================================================
  # MOODIFY FRONTEND
  # React + Vite Static Site
  # ==========================================================

  - type: web
    runtime: static
    name: moodify-frontend

    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    rootDir: frontend

    autoDeployTrigger: commit

    envVars:
      - key: VITE_API_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      - path: /*
        name: X-Frame-Options
        value: DENY

      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin