services:
  - type: web
    runtime: docker
    name: moodify-api
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: MOODIFY_SECRET_KEY
        generateValue: true
      - key: MOODIFY_EMOTION_LABELS
        value: angry,disgust,fear,happy,sad,surprise,neutral
      - key: MOODIFY_FRONTEND_ORIGINS
        sync: false
      - key: TF_NUM_INTRAOP_THREADS
        value: "1"
      - key: TF_NUM_INTEROP_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"

  - type: web
    runtime: static
    name: moodify-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: header
        path: /*
        name: X-Content-Type-Options
        value: nosniff
      - type: header
        path: /*
        name: X-Frame-Options
        value: DENY
      - type: header
        path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
