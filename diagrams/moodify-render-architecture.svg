<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141a2f"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#b8c1d9"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <circle cx="1260" cy="150" r="210" fill="#6d5dfc" opacity="0.09"/>
  <circle cx="300" cy="780" r="260" fill="#06b6d4" opacity="0.06"/>

  <text x="90" y="90" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="800">MOODIFY AI</text>
  <text x="90" y="135" fill="#9aa6bf" font-family="Inter,Arial,sans-serif" font-size="23">Subscription-free cloud-ready architecture • Render + Docker</text>

  <!-- Browser -->
  <g filter="url(#shadow)">
    <rect x="85" y="205" rx="26" ry="26" width="410" height="210" fill="#171e35" stroke="#333c59"/>
    <rect x="85" y="205" rx="26" ry="26" width="410" height="62" fill="#202943"/>
    <circle cx="119" cy="236" r="8" fill="#59657f"/><circle cx="145" cy="236" r="8" fill="#59657f"/><circle cx="171" cy="236" r="8" fill="#59657f"/>
    <text x="115" y="316" fill="#ffffff" font-size="30" font-weight="700" font-family="Inter,Arial,sans-serif">User Browser</text>
    <text x="115" y="350" fill="#a7b0c5" font-size="18" font-family="Inter,Arial,sans-serif">React UI • camera • music • scans</text>
    <text x="115" y="383" fill="#7f8ba7" font-size="16" font-family="Inter,Arial,sans-serif">HTTPS requests / JSON + multipart</text>
  </g>

  <!-- frontend -->
  <g filter="url(#shadow)">
    <rect x="595" y="185" rx="30" ry="30" width="430" height="250" fill="url(#front)"/>
    <text x="635" y="242" fill="#ffffff" font-size="17" font-weight="800" font-family="Inter,Arial,sans-serif" letter-spacing="2">PUBLIC WEB</text>
    <text x="635" y="292" fill="#ffffff" font-size="34" font-weight="800" font-family="Inter,Arial,sans-serif">Render Static Site</text>
    <text x="635" y="330" fill="#e7e5ff" font-size="19" font-family="Inter,Arial,sans-serif">React + Vite</text>
    <text x="635" y="362" fill="#e7e5ff" font-size="17" font-family="Inter,Arial,sans-serif">Landing • Auth • Dashboard • Scan Studio</text>
    <text x="635" y="392" fill="#e7e5ff" font-size="17" font-family="Inter,Arial,sans-serif">Research Console • Mood Player</text>
  </g>

  <!-- backend -->
  <g filter="url(#shadow)">
    <rect x="595" y="520" rx="30" ry="30" width="430" height="300" fill="url(#ai)"/>
    <text x="635" y="577" fill="#ffffff" font-size="17" font-weight="800" font-family="Inter,Arial,sans-serif" letter-spacing="2">CLOUD API</text>
    <text x="635" y="627" fill="#ffffff" font-size="34" font-weight="800" font-family="Inter,Arial,sans-serif">Render Web Service</text>
    <text x="635" y="663" fill="#e9fbff" font-size="19" font-family="Inter,Arial,sans-serif">Docker • FastAPI • Gunicorn</text>
    <text x="635" y="698" fill="#e9fbff" font-size="17" font-family="Inter,Arial,sans-serif">JWT authentication • Emotion API • Beauty API</text>
    <text x="635" y="728" fill="#e9fbff" font-size="17" font-family="Inter,Arial,sans-serif">Health checks • CORS • structured request logging</text>
    <text x="635" y="758" fill="#d5f5fb" font-size="16" font-family="Inter,Arial,sans-serif">Binds to Render PORT (default 10000)</text>
  </g>

  <!-- AI / data -->
  <g filter="url(#shadow)">
    <rect x="1110" y="230" rx="26" ry="26" width="390" height="185" fill="url(#data)"/>
    <text x="1150" y="282" fill="#ffffff" font-size="17" font-weight="800" font-family="Inter,Arial,sans-serif" letter-spacing="2">AI INFERENCE</text>
    <text x="1150" y="327" fill="#ffffff" font-size="29" font-weight="800" font-family="Inter,Arial,sans-serif">TensorFlow / Keras CNN</text>
    <text x="1150" y="360" fill="#eafff0" font-size="17" font-family="Inter,Arial,sans-serif">emotion_cnn.h5 • 48×48×1 input • 7 classes</text>
    <text x="1150" y="392" fill="#d9fbe5" font-size="16" font-family="Inter,Arial,sans-serif">OpenCV face preprocessing</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1110" y="500" rx="26" ry="26" width="390" height="210" fill="#242c45" stroke="#3a4667"/>
    <text x="1150" y="548" fill="#ffffff" font-size="17" font-weight="800" font-family="Inter,Arial,sans-serif" letter-spacing="2">APPLICATION SERVICES</text>
    <text x="1150" y="590" fill="#ffffff" font-size="22" font-weight="700" font-family="Inter,Arial,sans-serif">Beauty Scan</text>
    <text x="1150" y="624" fill="#ffffff" font-size="22" font-weight="700" font-family="Inter,Arial,sans-serif">Mood → Music mapping</text>
    <text x="1150" y="658" fill="#ffffff" font-size="22" font-weight="700" font-family="Inter,Arial,sans-serif">Research metrics API</text>
    <text x="1150" y="692" fill="#9da9c2" font-size="15" font-family="Inter,Arial,sans-serif">Visual proxies are non-clinical.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1110" y="770" rx="26" ry="26" width="390" height="95" fill="#18243a" stroke="#33405f"/>
    <text x="1150" y="810" fill="#ffffff" font-size="20" font-weight="700" font-family="Inter,Arial,sans-serif">Prototype storage</text>
    <text x="1150" y="839" fill="#9da9c2" font-size="15" font-family="Inter,Arial,sans-serif">SQLite • ephemeral on free service</text>
  </g>

  <!-- arrows -->
  <path d="M495 310 C540 310 555 310 590 310" stroke="#b8c1d9" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M810 440 C810 470 810 490 810 515" stroke="#b8c1d9" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1028 650 C1060 650 1075 650 1105 650" stroke="#b8c1d9" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1028 670 C1070 670 1080 345 1105 345" stroke="#b8c1d9" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1300 415 C1300 455 1300 470 1300 495" stroke="#b8c1d9" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1300 710 C1300 735 1300 750 1300 765" stroke="#b8c1d9" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- labels -->
  <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#8f9bb5">
    <text x="512" y="295">HTTPS</text>
    <text x="832" y="475">REST / JSON / upload</text>
    <text x="1048" y="635">service logic</text>
    <text x="1045" y="385">prediction</text>
    <text x="1318" y="465">shared runtime</text>
  </g>

  <text x="90" y="860" fill="#7e8aa5" font-size="15" font-family="Inter,Arial,sans-serif">Deployment note: free Render services are intended for demos/testing; TensorFlow memory needs should be validated against the selected plan.</text>
</svg>
